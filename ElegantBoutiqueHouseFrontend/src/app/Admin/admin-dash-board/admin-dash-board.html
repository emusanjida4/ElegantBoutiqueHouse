<div class="dashboard-container">

  <h2 class="dashboard-title">Admin Dashboard</h2>

  <div class="card-grid">

    <!-- User -->
    <div class="dashboard-card" (click)="navigate('/admin/users')">
      <div class="icon">👤</div>
      <h3>User</h3>
      <p>Manage users</p>
    </div>

    <!-- Product -->
    <div class="dashboard-card" (click)="navigate('/admin/products')">
      <div class="icon">👗</div>
      <h3>Product</h3>
      <p>Manage products</p>
    </div>

    <!-- Category -->
    <div class="dashboard-card" (click)="navigate('/admin/category')">
      <div class="icon">📂</div>
      <h3>Category</h3>
      <p>Manage categories</p>
    </div>

    <!-- SubCategory -->
    <div class="dashboard-card" (click)="navigate('/admin/subcategories')">
      <div class="icon">📁</div>
      <h3>SubCategory</h3>
      <p>Manage subcategories</p>
    </div>

  </div>

</div>
