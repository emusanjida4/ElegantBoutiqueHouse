<div class="container">

  <h2 class="title">Admin Panel – User List</h2>

  <button class="save-btn" type="button" (click)="goToAddUser()">
    Save New User
  </button>

  <!-- 🔥 EDIT BOX (same page) -->
  

  <input
    type="text"
    class="search-box"
    placeholder="Search by name, email or phone..."
    [(ngModel)]="searchText"
    (input)="searchUser()"
  />

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>User Type</th>
        <th>Gender</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.Id }}</td>
        <td>{{ user.Name }}</td>
        <td>{{ user.Email }}</td>
        <td>{{ user.Phone }}</td>
        <td>{{ user.Address }}</td>
        <td>{{ user.UserType }}</td>
        <td>{{ user.Gender }}</td>
        <td>
          
          <button class="delete-btn" (click)="deleteUser(user.Id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
