<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <!-- Profile Card -->
      <div class="card shadow-lg rounded-4">
        <div class="card-body">

          <!-- User Info -->
          <div class="d-flex align-items-center mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/8847/8847419.png" alt="Profile" class="rounded-circle me-3 profile-img">
            <div>
              <h3 class="card-title mb-1">{{ user.Name  }}</h3>
              <p class="mb-0 text-muted">{{ user.Email }}</p>
              <p class="mb-0 text-muted">{{ user.Phone }}</p>
            </div>
          </div>

          <!-- Order Summary -->
          <div class="mb-4">
            <h5 class="mb-3">Order Summary</h5>
            <div class="d-flex justify-content-between">
              <span>Total Orders:</span>
              <span class="fw-bold">{{ totalOrders }}</span>
            </div>
            <div class="d-flex justify-content-between">
              <span>Total Amount:</span>
              <span class="fw-bold">৳ {{ totalAmount }}</span>
            </div>
          </div>

          <!-- Cart Items -->
          <div>
            <h5 class="mb-3">Cart Items</h5>
            <div *ngFor="let item of cartItems" class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded-2">
              <div>
                <strong>{{ item.ProductName }}</strong> × {{ item.Quantity }}
              </div>
              <div>৳ {{ item.TotalPrice }}</div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
